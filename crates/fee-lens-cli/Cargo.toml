[package]
name = "fee-lens-cli"
description = "Command line interface for fee-lens: what a Solana transaction actually paid to land."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "fee-lens"
path = "src/main.rs"

[dependencies]
fee-lens-core = { path = "../fee-lens-core" }
serde.workspace = true
serde_json.workspace = true
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
# Blocking HTTP on purpose: this CLI makes a handful of sequential requests and
# bounded-concurrency reads over scoped threads. Pulling in an async runtime to
# await four calls would be weight without a reason.
ureq = { version = "3.5.0", default-features = false, features = ["rustls", "json"] }

[lints]
workspace = true
